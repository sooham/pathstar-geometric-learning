# Minimal sweep configuration for quick testing
# Focuses on a few key hyperparameters
program: train.py
method: grid
metric:
  name: train/loss/overall
  goal: minimize

parameters:
  # Dataset parameters - small fixed values for quick iteration
  graph_d:
    values: [10]
  graph_l:
    values: [50, 100, 1000]
  graph_vocab_size:
    value: '1max'
  graph_holdout_percentage:
    value: 0.2
  num_pause_tokens:
    values: [0] 
  use_undirected:
    value: true
  use_directional_tokens:
    values: [false]
  use_task_tokens:
    values: [true]
  balance_interleaved_datasets:
    values: [false]
  weight_tying:
    values: [true] # weight tying requires that the input to the unembedding matrix match the embedding of the output, so x + W_0 (attn from v) needs to be close.
  edge_only:
    value: true
  use_pos_embeddings:
    value: false
  predict_direction_for_edge_task:
    values: [false]
  use_task_tokens_in_path:
    values: [false] # for now test this
  p_autoregressive_substitution:
    values: [0]
  
  # Model + Training config combinations (partial cross-product)
  # Lists within a dict are expanded into cross products
  # Single values remain fixed for that config group
  model_config:
    values:
      # Deep models (n_layer=5): sweep MLP and LayerNorm (2x2 = 4 configs)
      - n_layer: [0]
        n_head: 1
        n_embd: [4]
        dropout: [0]
        embed_dropout: 0
        bias: [true]
        base: 100
        learning_rate: 1e-3
        weight_decay: [0]
        lr_scheduler: 'None' #'ReduceLROnPlateau'
        epochs: 20_000
        use_mlp: [true]
        use_layernorm: [true]
        seed: [4731]

  # Other training hyperparameters (not in model_config)
  label_smoothing:
    values: [0]
  beta1:
    value: 0.9
  beta2:
    value: 0.95
  grad_clip:
    value: 1.0

  # LR schedule params (when lr_scheduler is set in model_config)
  plateau_factor:
    value: 0.80
  plateau_patience:
    value: 30
  plateau_threshold:
    value: 1e-4
  plateau_cooldown:
    value: 0
  warmup_frac:
    value: 0.1
  lr_decay_frac:
    value: 1
  min_lr:
    value: 1e-5
  target_val_loss:
    value: 0.001
  gradient_accumulation_steps:
    value: 1  # Reduced from 4 for fewer optimizer steps, better GPU utilization
  compile:
    value: true
  eval_interval:
    value: 10  # Increased from 50 to reduce evaluation overhead
  log_interval:
    value: 1  # Increased from 10 to reduce print overhead
  print_eval_interval:
    value: 1
  live_display:
    value: true
  vis_interval:
    value: 10
  debug_masking:
    value: false
  log_attention_maps:
    value: false
  show_edge_memorization_metrics:
    value: true
  attention_map_interval:
    value: 8000
  batch_size:
    value: 4000
  # init_from:
  #   value: resume
  
  wandb_project:
    value: test_node2vec
