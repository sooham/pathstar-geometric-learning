# Minimal sweep configuration for quick testing
# Focuses on a few key hyperparameters
program: train.py
method: grid
metric:
  name: val/loss/overall
  goal: minimize

parameters:
  # Dataset parameters - small fixed values for quick iteration
  graph_d:
    values: [1000]
  graph_l:
    value: 5
  randomize_vocab_size:
    value: 'auto'
  graph_holdout_percentage:
    value: 0.2
  num_pause_tokens:
    values: [4]
  use_undirected:
    values: [true, false]
  use_directional_tokens:
    values: [false, true]
  use_task_tokens:
    values: [false, true]
  
  # Model architecture parameters - sweep these
  n_layer:
    values: [1,9]
  n_head:
    values: [8]
  n_embd:
    values: [8,128]
  dropout:
    values: [0.01]
  embd_dropout:
    value: 0
  bias:
    value: false
  
  # Training hyperparameters - sweep learning rate
  learning_rate:
    value: 1e-3
  label_smoothing:
    value: 0.1
  weight_decay:
    value: 0.01
  adam_beta1:
    value: 0.9
  adam_beta2:
    value: 0.95
  grad_clip:
    value: 1.0
  
  # Learning rate schedule
  decay_lr:
    value: true
  lr_warmup_frac:
    value: 0.10
  min_learning_rate:
    value: 1e-6
  
  # Fixed training parameters
  epochs:
    value: 1000  # Shorter for quick testing
  edge_iterations_per_epoch: 
    value: 10 # 8k edges total 
  path_iterations_per_epoch: 
    value: 40  # 200 paths in validation, 800 paths in training 
  gradient_accumulation_steps:
    value: 1  # Reduced from 4 for fewer optimizer steps, better GPU utilization
  compile:
    value: true
  eval_interval:
    value: 10  # Increased from 50 to reduce evaluation overhead
  eval_verbose_interval:
    value: 1000
  log_interval:
    value: 1  # Increased from 10 to reduce print overhead

  wandb_project:
    value: pathstar_interleave

